name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: pnpm run version:check

      - name: Lint
        run: pnpm run lint

      - name: Run regression tests
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            artifactLabel: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - name: Linux ARM64
            artifactLabel: Linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu
          - name: Windows x64
            artifactLabel: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - name: Windows ARM64
            artifactLabel: Windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
          - name: macOS Apple Silicon
            artifactLabel: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            artifactLabel: macOS-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file

      - name: Check Windows ARM64 build tools
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installation) {
            throw 'The Windows ARM64 target requires the Visual Studio C++ ARM64 build tools.'
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: Lamp ${{ needs.verify.outputs.tag }}
          releaseBody: |
            ### Downloads
            - Windows / Linux: choose `x64` for Intel or AMD PCs, or `arm64` for ARM-based devices.
            - macOS: choose `arm64` for Apple Silicon (M-series), or `x64` for Intel Macs.
            - Windows: `-setup.exe` is the standard installer; `.msi` is also available.
            - Linux: `.AppImage` is the portable package; `.deb` and `.rpm` are system packages.
            - macOS: use `.dmg` to install Lamp.
            - macOS builds use ad-hoc signing and are not notarized by Apple. Gatekeeper may block the first launch. Only if you trust the downloaded build, follow [Apple's instructions](https://support.apple.com/en-us/102445) to open it from System Settings > Privacy & Security. Do not disable Gatekeeper globally.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          assetNamePattern: "[name]-v[version]-${{ matrix.artifactLabel }}[setup][ext]"
          args: ${{ matrix.args }}

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$BUILD_TARGET/release/bundle/macos/Lamp.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on the macOS application bundle." >&2
            exit 1
          fi
